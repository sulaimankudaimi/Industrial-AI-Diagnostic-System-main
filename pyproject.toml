[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "diagnostic"
version = "0.1.0"
description = "Acoustic anomaly detection for rotating industrial machines."
requires-python = ">=3.11,<3.13"
dependencies = [
    "numpy>=2.4",
    "librosa>=0.11",
    "soundfile>=0.14",
    "pyyaml>=6.0",
    "scikit-learn>=1.9",
]

[project.optional-dependencies]
ml = ["tensorflow-cpu>=2.21"]
app = [
    "streamlit>=1.65",
    "matplotlib>=3.11",
    "pillow>=12.3",
]
dev = [
    "ruff>=0.17",
    "pytest>=9.1",
    "pytest-cov>=7.1",
    "pre-commit>=4.6",
    "jupyterlab>=4.6",
    "ipykernel>=7.4",
    "nbformat>=5.11",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["diagnostic"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "ml: tests that require tensorflow (deselected in CI with -m 'not ml')",
]
